name: ocnos-test

topology:
  nodes:
    r1:
      kind: ipinfusion_ocnos
      image: vrnetlab/ipinfusion_ocnos:7.0.0-262
      binds:
        - configs/r1.cfg:/config/startup-config.cfg:ro
    r2:
      kind: ipinfusion_ocnos
      image: vrnetlab/ipinfusion_ocnos:7.0.0-262
      binds:
        - configs/r2.cfg:/config/startup-config.cfg:ro
    r3:
      kind: mikrotik_ros
      image: vrnetlab/mikrotik_routeros:7.23.2
  links:
    - endpoints: ["r1:eth1", "r2:eth1"]
    - endpoints: ["r1:eth2", "r3:eth1"]
