name: ocnos-test

topology:
  nodes:
    p1:
      kind: ipinfusion_ocnos
      image: vrnetlab/ipinfusion_ocnos:7.0.0-262
      binds:
        - configs/r1.cfg:/config/startup-config.cfg:ro
    p4:
      kind: ipinfusion_ocnos
      image: vrnetlab/ipinfusion_ocnos:7.0.0-262
      binds:
        - configs/r4.cfg:/config/startup-config.cfg:ro
    p5:
      kind: ipinfusion_ocnos
      image: vrnetlab/ipinfusion_ocnos:7.0.0-262
      binds:
        - configs/r5.cfg:/config/startup-config.cfg:ro
    pe2:
      kind: ipinfusion_ocnos
      image: vrnetlab/ipinfusion_ocnos:7.0.0-262
      binds:
        - configs/r2.cfg:/config/startup-config.cfg:ro
    pe3:
      kind: mikrotik_ros
      image: vrnetlab/mikrotik_routeros:7.23.2
      startup-config: configs/r3.cfg
    pe6:
      kind: mikrotik_ros
      image: vrnetlab/mikrotik_routeros:7.23.2
      startup-config: configs/r6.cfg
    rr-vpls:
      kind: mikrotik_ros
      image: initnetworks/clab_images:ros-6.49.13
      startup-config: configs/rr-vpls.cfg
    pc1:
      kind: linux
      image: initnetworks/clab_images:host
      exec:
        - ip address add dev eth1 192.168.0.2/24
    pc2:
      kind: linux
      image: initnetworks/clab_images:host
      exec:
        - ip address add dev eth1 192.168.1.2/24
    pc3:
      kind: linux
      image: initnetworks/clab_images:host
      exec:
        - ip address add dev eth1 192.168.2.3/24
    pc4:
      kind: linux
      image: initnetworks/clab_images:host
      exec:
        - ip address add dev eth1 192.168.2.4/24
    pc5:
      kind: linux
      image: initnetworks/clab_images:host
      exec:
        - ip address add dev eth1 192.168.2.5/24

  links:
    - endpoints: [ "p1:eth1", "pe2:eth1" ]
    - endpoints: [ "p1:eth2", "p4:eth1" ]
    - endpoints: [ "p1:eth3", "pe6:eth1" ]
    - endpoints: [ "pe2:eth2", "p5:eth1" ]
    - endpoints: [ "p4:eth2", "pe3:eth1" ]
    - endpoints: [ "p4:eth3", "pe6:eth2" ]
    - endpoints: [ "p5:eth2", "pe3:eth2" ]
    - endpoints: [ "p5:eth3", "rr-vpls:eth1" ]
    - endpoints: [ "pe2:eth3", "pc1:eth1" ]
    - endpoints: [ "pe3:eth3", "pc2:eth1" ]
    - endpoints: [ "pe2:eth4", "pc3:eth1" ]
    - endpoints: [ "pe3:eth4", "pc4:eth1" ]
    - endpoints: [ "pe6:eth3", "pc5:eth1" ]
