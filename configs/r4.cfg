hostname R1

router ldp
 transport-address ipv4 4.4.4.4

interface lo
ip address 4.4.4.4/32 secondary

interface eth1
 no shutdown
 ip address 10.0.0.3/31
 ip ospf network point-to-point
 ip ospf message-digest-key 1 md5 labocnos
 label-switching
 enable-ldp ipv4

interface eth2
 no shutdown
 ip address 10.0.0.4/31
 ip ospf network point-to-point
 ip ospf message-digest-key 1 md5 labocnos
 label-switching
 enable-ldp ipv4

interface eth3
 no shutdown
 ip address 10.0.0.12/31
 ip ospf network point-to-point
 ip ospf message-digest-key 1 md5 labocnos
 label-switching
 enable-ldp ipv4

router ospf 1
 ospf router-id 4.4.4.4
 area 0 authentication message-digest
 network 4.4.4.4/32 area 0.0.0.0
 network 10.0.0.2/31 area 0.0.0.0
 network 10.0.0.4/31 area 0.0.0.0
 network 10.0.0.12/31 area 0.0.0.0
