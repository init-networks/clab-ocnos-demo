mpls vpls CUST_B 101
 vpls-mtu 1500
 signaling ldp
  bgp-auto-discovery
    l2vpn-id 65000:101
    rd 65000:101
    route-target both 65000:101
  exit-bgp-auto-discovery
 exit-signaling
 exit-vpls

hostname R2

ip vrf CUST_A
 rd 65000:1
 route-target both 65000:1

router ldp
 router-id 2.2.2.2
 transport-address ipv4 2.2.2.2

interface lo
ip address 2.2.2.2/32 secondary

interface eth1
 no shutdown
 ip address 10.0.0.0/31
 ip ospf network point-to-point
 ip ospf authentication message-digest 
 ip ospf message-digest-key 1 md5 labocnos
 label-switching
 enable-ldp ipv4

interface eth2
 no shutdown
 ip address 10.0.0.9/31
 ip ospf network point-to-point
 ip ospf authentication message-digest 
 ip ospf message-digest-key 1 md5 labocnos
 label-switching
 enable-ldp ipv4

interface eth3
 no shutdown
 ip vrf forwarding CUST_A
 ip address 192.168.0.1/24

interface eth4.1 switchport
 encapsulation untagged
 access-if-vpls
  mpls-vpls CUST_B

router ospf 1
 ospf router-id 2.2.2.2
 area 0 authentication message-digest
 network 2.2.2.2/32 area 0.0.0.0
 network 10.0.0.0/31 area 0.0.0.0
 network 10.0.0.8/31 area 0.0.0.0

router bgp 65000
 neighbor 3.3.3.3 remote-as 65000
 neighbor 3.3.3.3 description R3 
 neighbor 100.100.100.100 remote-as 65000
 neighbor 100.100.100.100 description RR-VPLS 
 !
 address-family vpnv4 unicast
 neighbor 3.3.3.3 activate
 exit-address-family
 !
 !address-family l2vpn vpls
 !neighbor 100.100.100.100 activate
 !exit-address-family
 !
 address-family ipv4 vrf CUST_A
 network 192.168.0.0/24
 exit-address-family
 !
 exit